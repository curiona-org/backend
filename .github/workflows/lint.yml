name: Lint

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
        env:
          GO111MODULE: off
      - run: go build -buildvcs=false -ldflags="-s -w" -v
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v6.5.1